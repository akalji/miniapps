name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/jar-labler/package-lock.json

      - name: Set up npm
        run: npm install --global npm@11.17.0

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install shell dependencies
        run: npm ci

      - name: Install MiniApp dependencies
        run: npm ci --prefix apps/jar-labler

      - name: Test shell
        run: npm test -- --watch=false

      - name: Test MiniApp
        run: npm --prefix apps/jar-labler test -- --watch=false

      - name: Build shell
        run: >-
          npx ng build startpage --configuration production
          --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: Build standalone MiniApp
        run: >-
          npm --prefix apps/jar-labler run build --
          --configuration production,hosted
          --base-href "${{ steps.pages.outputs.base_path }}/apps/jar-labler/"

      - name: Assemble Pages site
        run: |
          node scripts/assemble.mjs
          cp dist/startpage/browser/index.html dist/startpage/browser/404.html
          touch dist/startpage/browser/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/startpage/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
